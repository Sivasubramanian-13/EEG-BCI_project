<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NeuroSense AI | Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../static/css/auth.css">
</head>
<body>
    <div id="three-bg" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; overflow: hidden;"></div>
    <div class="auth-container" style="position: relative; z-index: 10;">
        <div class="glass-panel">
            <div class="header">
                <h1>NeuroSense <span>AI</span></h1>
                <p>Sign in to access your clinical dashboard</p>
            </div>

            <form id="login-form" autocomplete="off">
                <div class="input-group">
                    <i class="fas fa-envelope"></i>
                    <input type="email" id="email" placeholder="Email Address" required autocomplete="off">
                </div>
                
                <div class="input-group">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="password" placeholder="Password" required autocomplete="new-password">
                    <i class="fas fa-eye toggle-password" id="toggle-pwd"></i>
                </div>

                <div class="options">
                    <label>
                        <input type="checkbox" id="remember-me"> Remember me
                    </label>
                    <a href="#" id="forgot-password">Forgot Password?</a>
                </div>

                <div id="error-msg" class="error-message"></div>

                <button type="submit" class="btn-primary" id="login-btn">
                    <span id="btn-text">Sign In</span>
                    <div class="spinner" id="btn-spinner"></div>
                </button>
            </form>

            <div class="footer-text">
                Don't have an account? <a href="/signup">Create Account</a>
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="toast">
        <i class="fas fa-info-circle" id="toast-icon"></i>
        <span id="toast-message">Notification message</span>
    </div>

    <script type="module" src="../static/js/auth.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.globe.min.js"></script>
    <script>
        VANTA.GLOBE({
            el: "#three-bg",
            mouseControls: true,
            touchControls: true,
            gyroControls: false,
            minHeight: 200.00,
            minWidth: 200.00,
            scale: 1.00,
            scaleMobile: 1.00,
            color: 0x38bdf8,
            color2: 0x0284c7,
            size: 1.50,
            backgroundColor: 0x020617
        });
    </script>
</body>
</html>
