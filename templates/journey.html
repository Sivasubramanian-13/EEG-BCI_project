<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VoxAura AI | Patient Journey</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body>

<div class="dashboard-layout" style="display: none;">
    <!-- SIDEBAR -->
    <aside class="sidebar glass-panel">
        <div class="brand">
            <i class="fas fa-brain"></i> VoxAura AI
        </div>

        <div class="patient-card">
            <img id="patient-avatar" src="https://ui-avatars.com/api/?name=Patient&background=0D8ABC&color=fff" alt="Patient Avatar">
            <h3 id="patient-name">Loading...</h3>
            <p id="patient-details"><span id="patient-age">--</span> yrs &bull; <span id="patient-gender">--</span></p>
            <p id="patient-condition" style="color: var(--accent); font-weight: 600;">Loading...</p>
            <p style="font-size: 11px; margin-top: 5px;">ID: <span id="patient-id">--</span></p>
        </div>

        <ul class="nav-menu">
            <li><a href="/dashboard"><i class="fas fa-desktop"></i> Dashboard</a></li>
            <li><a href="/journey" class="active"><i class="fas fa-route"></i> Journey Page</a></li>
            <li><a href="/report"><i class="fas fa-file-medical-alt"></i> Generate Report</a></li>
            <li><a href="/history"><i class="fas fa-history"></i> History / Logs</a></li>
            <li><a href="/settings"><i class="fas fa-cog"></i> Settings</a></li>
        </ul>

        <button class="btn-logout" id="logout-btn">
            <i class="fas fa-sign-out-alt"></i> Logout
        </button>
    </aside>

    <!-- MAIN VIEW -->
    <main class="main-view glass-panel" style="grid-column: 2 / span 2;">
        <div class="header-top">
            <h2>Patient Journey</h2>
        </div>
        
        <div style="background: rgba(255,255,255,0.03); border: 1px solid var(--border-glass); border-radius: 16px; padding: 30px; margin-top: 20px;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <p style="color: var(--text-muted); margin: 0;">This module tracks the long-term EEG recovery journey.</p>
                <button id="toggle-log-btn" style="background: var(--accent); color: white; border: none; padding: 8px 16px; border-radius: 8px; cursor: pointer;">
                    <i class="fas fa-plus"></i> Add Log
                </button>
            </div>

            <!-- Add Log Form -->
            <form id="journey-form" style="display: none; background: rgba(0,0,0,0.2); padding: 20px; border-radius: 12px; margin-bottom: 30px;">
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 15px;">
                    <div>
                        <label style="display: block; color: var(--text-muted); margin-bottom: 5px; font-size: 13px;">Date</label>
                        <input type="date" id="log-date" required style="width: 100%; padding: 10px; border-radius: 8px; background: rgba(255,255,255,0.05); border: 1px solid var(--border-glass); color: white;">
                    </div>
                    <div>
                        <label style="display: block; color: var(--text-muted); margin-bottom: 5px; font-size: 13px;">Status / Severity</label>
                        <select id="log-status" required style="width: 100%; padding: 10px; border-radius: 8px; background: rgba(255,255,255,0.05); border: 1px solid var(--border-glass); color: white;">
                            <option value="Critical" style="color: black;">Critical (Red)</option>
                            <option value="Improving" style="color: black;">Improving (Yellow)</option>
                            <option value="Stable" style="color: black;">Stable (Green)</option>
                            <option value="Baseline" style="color: black;">Baseline (Blue)</option>
                        </select>
                    </div>
                </div>
                <div style="margin-bottom: 15px;">
                    <label style="display: block; color: var(--text-muted); margin-bottom: 5px; font-size: 13px;">Clinical Notes & Observations</label>
                    <textarea id="log-notes" required rows="3" style="width: 100%; padding: 10px; border-radius: 8px; background: rgba(255,255,255,0.05); border: 1px solid var(--border-glass); color: white;"></textarea>
                </div>
                <button type="submit" id="save-log-btn" style="background: var(--status-green); color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: 600;">
                    Save Log
                </button>
            </form>
            
            <div id="dynamic-timeline" style="position: relative; padding-left: 30px; border-left: 2px solid var(--accent);">
                <p style="color: var(--text-muted);">Loading logs...</p>
            </div>
        </div>
    </main>
</div>

<script type="module" src="{{ url_for('static', filename='js/dashboard.js') }}"></script>
<script type="module" src="{{ url_for('static', filename='js/journey.js') }}"></script>
</body>
</html>
